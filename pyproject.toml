[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencedesk"
version = "0.1.0"
description = "Document question answering with retrieval and source citations"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
evidencedesk = "evidencedesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
